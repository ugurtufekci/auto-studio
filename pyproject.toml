[project]
name = "auto-studio"
version = "0.1.0"
# 3.11 is the floor, and it is a real one rather than a preference:
# datetime.UTC arrived in 3.11 and the adapters use it. Declared here so
# a tool says so before an import does.
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "assets", "store"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # long lines are handled by line-length, prompts legitimately run long
  "B008",   # fine for our default-arg style
]

[tool.ruff.lint.per-file-ignores]
"dashboard/serve.py" = ["E501"]     # embedded HTML/CSS/JS
"studio/factory_local.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
