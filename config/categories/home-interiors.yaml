# Home & interiors — priority 1 (see config/categories.yaml for why)
label: Home & interiors
priority: 1

reddit:
  # fetched as ONE combined feed: r/a+b+c/hot.rss
  # nurseries and gardens joined June's world on 2026-08-17 — same eye,
  # same account, so they draw from the same pool rather than a new one
  subreddits: [InteriorDesign, CozyPlaces, malelivingspace, DesignMyRoom,
               NurseryDesign, gardening, landscaping]
  limit: 50

news_queries:
  - interior design trend
  - small space living
  - furniture design
  - home decor trend
  - nursery design trend
  - garden design trend

youtube_channels:
  # @handles; resolved to channel ids at runtime and cached
  - NeverTooSmall
  - TheLocalProject

rss_feeds:
  - {name: Dezeen, url: "https://www.dezeen.com/feed/"}
  - {name: Design Milk, url: "https://design-milk.com/feed/"}
  - {name: Apartment Therapy, url: "https://www.apartmenttherapy.com/main.rss"}

hn_queries: [architecture, interior design]

visual_keywords:
  - living room afternoon light
  - wooden shelf styling
  - plant corner window
  - reading nook armchair
  - kitchen counter materials
  - nursery cot and rug
  - child's room wardrobe wall
  - garden paving and planting beds
  - small terrace railing and planters
