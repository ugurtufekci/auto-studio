# Slow living & daily ritual — priority 1 (see config/categories.yaml for why)
label: Slow living & daily ritual
priority: 1

reddit:
  # fetched as ONE combined feed: r/a+b+c/hot.rss
  subreddits: [simpleliving, minimalism, CozyPlaces, selfcare, Journaling, declutter]
  limit: 50

news_queries:
  - slow living
  - morning routine
  - minimalism trend
  - third place culture
  - digital detox

youtube_channels:
  # @handles; resolved to channel ids at runtime and cached
  - nathanieldrew

rss_feeds:
  - {name: The Minimalists, url: "https://www.theminimalists.com/feed/"}
  - {name: Apartment Therapy, url: "https://www.apartmenttherapy.com/main.rss"}

hn_queries: [minimalism, routine]

visual_keywords:
  - morning light through window
  - ceramic cup on linen
  - open book and blanket
  - candle on wooden desk
  - folded linens shelf
