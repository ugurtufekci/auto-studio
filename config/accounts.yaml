# ── Fleet registry ──────────────────────────────────────────────
# Every account the studio tracks, one row per platform leg.
# This is the single source of truth for "which accounts exist":
#   · the shared metrics harvest measures every row here — public pages
#     only, no credentials — and commits history to data/metrics/
#   · the ops console builds each persona's platform legs from these rows
#     (credentials in .env only decide whether a leg can PUBLISH)
#   · a future persona lands here as new rows; nothing else needs to know
#
# `persona` is the internal id from config/naming.md §1 — permanent, and the
# name of that persona's file in config/personas/. The persona owns its
# category (a point of view has one subject), so rows do not repeat it.
#
# handle is stored bare (no @).
#
# opened_at is the date the PLATFORM account was created — the warm-up
# governor's clock. It lives here rather than in the database because the
# database is machine-local: a fresh clone used to reset the clock and make a
# months-old account look newborn. A real date, in version control, cannot
# drift. Omit it and the guard treats the account as brand new (fail-safe).
#
# status: active | suspended | retired — an account under takedown must never
# be published to, whatever the credentials still allow.

accounts:
  - persona: mara
    platform: bluesky
    handle: sentronis.bsky.social
    opened_at: 2026-08-06
    status: suspended          # AccountTakedown; do not publish, do not retry
  - persona: mara
    platform: telegram
    handle: marabrews
    opened_at: 2026-08-06
    status: active

  - persona: june
    platform: instagram
    handle: athomewithjunecaprio
    opened_at: 2026-08-10
    status: active
    # NOTE, recorded so it is not forgotten rather than re-argued: "Caprio" is
    # a recognisable US media surname (Judge Frank Caprio's family publishes
    # "Cooking (at home) With The Caprio's", and the name is in current
    # reality-TV circulation). The handle can read as affiliated with them,
    # which is impersonation-classifier territory for a new account. The
    # operator considered this and chose to keep the handle. If Instagram ever
    # flags or restricts the account, this is the first thing to re-examine.
