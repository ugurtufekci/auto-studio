# ── Video format · style-morph ──────────────────────────────────
# Reference: @ai_architect_mastery, the reel the operator uploaded on
# 2026-08-17. Every number below was MEASURED off that file rather than
# guessed, because the first attempt at this format was a slideshow and
# the operator's note was exact: "artık slide show gibi değil düz video
# olması lazım" — no longer like a slideshow, it has to be one flat video.
#
# What the measurement found:
#   17.7s, 720×1280, 30fps, with audio
#   ZERO scene cuts — every change is a continuous morph, camera locked
#   0.0–2.2s   the ugly "before" room, with the opening line on it
#   4.0 / 7.0 / 10.0 / 13.0 / 16.0s  a style name appears, holds ~1.2s
#   → a strict 3.0s beat per style, the morph filling the gap between
#   text: white, bold, centred, at ~65% of the frame height, no box
#
# So the hook is the BEFORE, not the payoff: the first thing on screen is
# a room nobody would want, and the reason to keep watching is that it is
# about to stop being that.
id: style-morph
name: Style Morph
tagline: one room morphing through named design styles, no cuts

description: >
  A real continuous video, not a slideshow. One large, generously furnished
  room, held by a locked camera, re-skinned in place through six named
  design styles with no cut anywhere — the furniture never moves, only what
  it is made of changes. Each style's name appears on screen as it arrives
  and a low voice says that name, over a quiet music bed.

structure: >
  ONE BIG ROOM, ONE LOCKED CAMERA, SIX NAMED DESIGN STYLES, NO CUTS.

  `base_scene` is the room's ARCHITECTURE and CONTENTS — the thing every
  style re-skins. It is rendered once as the anchor and is NEVER SHOWN: the
  reel opens on the first style. So it carries no style of its own and,
  above all, it is never bare. The operator's instruction: "oranin bos hali
  olmayacak, 6 farkli tarz istiyorum senden".

  It must be LARGE, IMPRESSIVE AND DENSE, and if the concept names a hero
  feature — a staircase, a chimney, a gallery — the camera looks straight
  at it and it fills the middle of the frame. Write the architecture, then
  write everything IN it: seating, console tables, mirrors, art, rugs,
  planting, lighting, objects on every surface. Every one of those things
  is something six styles will re-skin, so a room with six objects gives
  six styles almost nothing to do. Density is the whole budget of this
  format.

  Each of the six `frame_swaps` RE-SKINS that room into ONE NAMED STYLE.
  The furniture does not move and does not change shape — its MATERIALS do,
  all of them at once. Each must be recognisable to someone who knows that
  style, and the materials must be the ones that style actually uses:
  Scandinavian minimalist means pale ash, white oil, wool and paper, not
  "light colours"; Art Deco means fluted wood, brass inlay, geometric
  marble and velvet; Moroccan means carved plaster, zellige, kilim and
  pierced brass; industrial means brick, blackened steel and worn leather.
  A style name with materials that do not belong to it is the failure this
  rule exists to prevent.

  Pick ONE style from six DIFFERENT families in style_families below and
  never two from the same one. Measured on the second real run: asked only
  to pick styles "far apart", the brief came back with two pale minimal
  rooms, and the second was thrown away after we had paid to render it.

  The camera, the room's shape, its glazing and its proportions never
  change. These are visualisations of one imagined room, never captioned
  as a real house.

style_suffix: >
  wide-angle 20mm interior photograph taken from inside a large room, camera
  well back in the space, the full width of the room wall to wall, generous
  ceiling height, floor and ceiling both in frame, deep space with
  foreground, middle and far distance, eye-level, deep focus, believable
  proportions and materials, richly furnished and dense with detail, not a
  doorway view, not a corridor, no door jamb or arch framing the picture,
  no people, no readable text, no logos, no watermark

# ── the two rules this style has to take off the default ────────
# The shared brief contract is written for a COLOURWAY comparison and it
# fights this format in both directions. Measured on the first real run
# (2026-08-17): the before-room came back as a pleasant, neutral, tidy room
# — no hook at all — and the five styles came back as five colour schemes
# with the furniture unchanged.
#
# Both were obedience, not error. The default says base_scene must contain
# no finishes a frame will change, and a tired room IS its worn carpet and
# its beige walls; the default also says a change may never touch the
# furniture, which is exactly what a design language does.
base_scene_rule: >
  the room every style re-skins — its ARCHITECTURE and its CONTENTS, with
  no style of its own. Rendered once as the geometric anchor and never
  shown: the reel opens on the first style, so this frame is not a "before"
  and must not be written as one. Nothing tired, nothing bare, no clutter
  to clear.

  IT IS LARGE, IMPRESSIVE AND FULL. The camera stands well back inside the
  space, the full width of the room wall to wall, generous ceiling height,
  floor and ceiling both readable, real depth from foreground to far
  distance. Never framed through a doorway or an arch: that crops the room
  to a slice, and a slice holds too little for a re-skin to read.

  THE HERO FEATURE FACES THE CAMERA. If the concept names one — a
  staircase, a chimney, a gallery — that feature is the SUBJECT of the
  frame: the camera is placed to look straight at it and it occupies the
  middle of the picture, at full height. Put it against a side wall or
  behind the lens and the reel is about a window instead. Say so explicitly
  in the scene: "the staircase fills the centre of the frame, seen head-on
  from across the hall". A window may be in shot, but it is never what the
  camera is aimed at.

  Write the architecture first — the hero feature and how it is built, the
  ceiling height, the glazing, the openings off it — then write everything
  standing in it: seating, console tables, mirrors, art, rugs, planting,
  chandeliers and lamps, objects on every surface. Name at least TWELVE
  distinct things and say where each one sits. Every one of them is
  something six styles will re-skin, so the count of things in the frame is
  the format's whole budget: a hall with a sofa and a rug gives six styles
  almost nothing to do, and the middle of the floor must not be empty.

  Describe SHAPES, POSITIONS AND MATERIALS-AS-SUBSTANCE only — "a stone
  staircase", "a long console", "a tall mirror" — and leave the finishes,
  colours and period to the styles. Write it ONCE; it is the starting point
  of all six.

change_rule: >
  A RE-SKIN OF THE SAME ROOM, NOT A REFURNISHING. Nothing moves, nothing is
  removed, nothing is added, nothing changes shape. The sofa stays the same
  sofa in the same place with the same silhouette; the armchair, the table,
  the shelving, the lamp and the rug all stay exactly where they are at
  exactly the same size. What changes is what they are MADE OF.

  So `change` OPENS WITH THE STYLE'S NAME and then names, surface by
  surface, the materials that style puts on the room that is already there
  — including the staircase, the balustrade and the floor it stands on:
  "authentic Art Deco: fluted dark walnut wall panelling with slim brass
  inlay, emerald velvet upholstery, black and white geometric marble floor,
  brass and smoked-glass table tops, jade silk curtains, a fluted brass
  lampshade". Walls, floor, upholstery, woodwork, metalwork, shades,
  curtains, rug pattern — those, and only those. Every piece of furniture
  stays standing, in place, at the same size.

  This is the whole format and it is not a preference. Written the other
  way round — asking for the furniture shapes to change — every frame came
  back with different furniture in different places, and a video model
  given two unrelated rooms can only CROSS-FADE between them. That is what
  makes a reel read as consecutive photographs instead of one room being
  re-dressed in front of you.

  THE SIX MUST NOT CONVERGE. At most ONE may have a pale palette and no two
  may share a dominant colour: measured on the fourth real run, of five
  styles the only two that failed the change gate were the two pale ones,
  at 1.2 and 5.9. Give the six a real spread — at least two dark or
  saturated, at least one warm and one cool, and every one of them a
  different family. Pale-and-neutral is where an unguided brief always
  lands, and six near-identical rooms is the one failure this format cannot
  survive.

  Each style is also a COHERENT DESIGN, not a colour swap: the walls, the
  floor, the upholstery, the metalwork and the shades all have to come from
  the same language, the way that style really builds a room. The operator
  asked for this in those words — "karsiligi olan mantikli designlar" —
  designs that correspond to something real.

  Never re-describe the camera, the window or the room's proportions: those
  never move either.

# The style NAME leads: it is what goes on screen and what the voice says.
# The materials after it are not shown in the video — they are read by the
# carousel twin, where a viewer has time to read them.
label_rule: >
  `label` opens with the STYLE NAME alone, no colour code — "Art Deco",
  "Scandinavian", "Moroccan", "Industrial", "French Country" — and then
  names two or three signature materials of that style with their hex
  codes: "Art Deco · fluted walnut #6B4A2F · aged brass #B08D57 · emerald
  velvet #0E5C4A". Generic material names and hex codes only, never a real
  paint brand, product or SKU.

# The reference opens on "Which style do you like?" — engagement bait, which
# this persona's contract bans by name. Her version of the same move is the
# one she already uses: she says which one is hers, and people arrive to
# disagree. So the opening line is a claim, not a question.
opening_line_rule: >
  four to seven words, lowercase, burned over the tired before-room. It must
  set up the five styles WITHOUT asking the reader anything and without any
  call to action — never "which do you like", never "comment below", never
  "save this". Say what this room is and that it is about to be five rooms:
  "this room, five ways", "same room. five decisions." Or stake her own
  claim so the disagreement comes for free: "one of these five is mine".

# Two styles from one family are one room shown twice, and the change gate
# only finds that out after both have been rendered. Checked here instead,
# before anything is spent — the list is the format's, so a new family is a
# line of yaml rather than a branch in the runner.
style_families:
  pale-minimal: [scandinavian, japandi, minimalist, nordic, coastal, scandi]
  ornate-historic: [art deco, victorian, edwardian, baroque, regency,
                    georgian, rococo, neoclassical, art nouveau]
  pattern-global: [moroccan, bohemian, boho, mediterranean, indian, andalusian,
                   moorish, turkish, eclectic]
  raw-industrial: [industrial, brutalist, loft, warehouse, concrete, utilitarian]
  rustic-country: [french country, farmhouse, cottage, provencal, provençal,
                   rustic, shaker, country]
  retro-modern: [mid-century modern, mid-century, midcentury, seventies, 1970s,
                 memphis, postmodern, space age, atomic]
  dark-dramatic: [maximalist, gothic, dark academia, moody, hollywood regency,
                  jewel box]
  natural-organic: [wabi-sabi, wabi sabi, organic modern, biophilic, earthy,
                    desert modern, tropical]

# Six styles and no before-room, set by the operator on 2026-08-19 for the
# villa hall: "oranin bos hali olmayacak, 6 farkli tarz istiyorum senden".
# Six styles with no before is FIVE transitions, not six — the before-room
# was a paid morph too.
# The persona's draw fixes ONE palette for a whole post, which is right for
# a comparison of schemes in one room and exactly wrong here: handed
# "charcoal and saffron", the first villa-hall run returned six named styles
# — Art Deco, Moroccan, Modernist, Spanish Colonial — that all printed the
# same four hex codes. Each style has to bring its own palette; the room,
# the view and the bones still come from the draw.
skip_draw: [palettes]

frames: [6, 6]
aspect: vertical

# ── the thing that makes this format itself ─────────────────────
assembly: morph          # frames are joined by generated video, not by a cut
before_frame: false      # the reel opens on the first STYLE, not a bare room
before_secs: 3.0         # how long the opening frame holds before the first morph
secs_per_frame: 3.0      # the reference's beat, style to style
label_hold: 1.2          # how long a style's name stays on screen

# Text as the reference draws it: no plate, no chip, centred, big.
label_style: centre
label_height: 0.65       # of the frame, top-down
cut: none

# The voice names the style as it arrives and says nothing else — the
# operator's instruction: "her farklı tarza geçerken o tarzı seslendirmesi
# yeter", and "art deco yazsın ve ses de art deco desin".
voiceover: names
music: true

hook: none               # the before-room IS the hook; a flash would fight it

carousel_twin: true

image_mode: edit

# Every other style costs about fifteen cents a reel. This one buys five
# generated transitions, and those are the product — so it is roughly a
# dollar. That is a decision for the operator to make on purpose, not
# something an unattended nightly cycle should drift into: the style is
# shootable with --style style-morph and stays out of the automatic
# rotation until the operator puts it in.
auto_rotate: false
cost_note: >
  ~$1.15 per reel: $1.00 of generated transitions (5 × $0.20), ~$0.15 of
  renders (one base room plus five style edits), and pennies for the spoken
  names and the music bed. Compare ~$0.15 for the cut-based styles. Shoot
  the frames first with --frames-only for ~$0.15, look at them, and buy the
  transitions once with --from-run against the set you approved.
