# ── Video format · material-board ───────────────────────────────
# A named style, not a persona setting: several personas can shoot this
# format, and one persona can shoot several formats. The operator picks by
# name — `python run.py --style material-board`.
#
# Reference: the material-first bedroom reels (46.9k likes, operator sent
# 2026-08-16). The reel alternates a FULL-SCREEN texture board with the
# finished room those materials build. Nothing is written on the room.
id: material-board
name: Material Board
tagline: full-screen textures, then the room they build

# what the operator sees in the console when picking a style
description: >
  One room, several complete material schemes. Each scheme opens with a
  full-frame board of its raw textures — named, with colour codes — and
  cuts to the same room finished in them. The room frames carry no text.

structure: >
  ONE LARGE ROOM, SEVERAL COMPLETE MATERIAL SCHEMES.

  THE ROOM MUST BE BIG AND THE CAMERA MUST BE INSIDE IT. A generous living
  room, a long kitchen with an island, a double-height library, a principal
  suite — the camera stands well back within the space, the full width of
  the room runs wall to wall across the frame, the ceiling and the floor are
  both readable, and a window or glazed wall carries a real view out: sea,
  city, hillside, garden. NEVER a doorway view, never a corridor, never a
  door jamb or arch framing the picture, never a corner vignette, never a
  single object. A narrow slice of a room holds two pieces of furniture, and
  two pieces of furniture cannot carry a material change — that is why this
  rule exists.

  Big is not the same as empty. Bare floor must never be the largest thing
  in the picture: something sits in the near foreground and the furniture
  fills the middle, so every scheme has surfaces enough to change.

  THE ROOM MUST SURVIVE AN ARCHITECT'S GLANCE. Every fixture appears
  exactly once — one sink with one tap, one cooker, one bath; facing
  counters never mirror each other's fittings. Walkways stay clear:
  nothing parked in a galley aisle or a doorway path — a dining table
  belongs beside the window or against the run, never in the middle of
  the circulation. And the composition sits OFF the central axis: never a
  dead-symmetric one-point view with matching left and right halves —
  the camera shifts to one side so the room reads as a place, not a
  rendering. (A two-tap kitchen with the table in the aisle reached the
  approval queue on 2026-08-23; the operator caught it, not the pipeline.)

  The camera does not move between schemes: same position, same lens, same
  light, same furniture in the same places. What changes per scheme is the
  WHOLE MATERIAL WORLD at once — upholstery, wall finish, timber tone,
  stone, tile, metal, textiles. Each scheme must read as the same room and
  unmistakably a different world; timid steps and near-duplicates are
  failures. For this format the palette widens beyond the persona's usual
  one: saturated and dark schemes (forest, oxblood, charcoal, black) are
  wanted, held together by the persona's light and materials. These are
  design VISUALIZATIONS of one imagined room — never captioned as a real
  renovation that happened.

# every frame's prompt ends with this; deliberately wider than June's
# intimate 35mm default — a swap only reads if the room is on screen
style_suffix: >
  wide-angle 20mm interior photograph taken from inside a large room, camera
  well back in the space and set off the central axis, the full width of the
  room wall to wall, generous ceiling height, floor and ceiling both in
  frame, deep space with foreground, middle and far distance, a window or
  glazed wall carrying a view out, eye-level, deep focus, believable
  proportions and materials, richly detailed and generously furnished with
  layered shelving, lighting, art and textiles, every fixture exactly once —
  a single sink with a single tap — walkways clear, asymmetric composition,
  quietly dreamlike but constructible, not a doorway view, not a corridor,
  no door jamb or arch framing the picture, not a symmetric one-point view,
  no mirrored duplicate fixtures, no people, no readable text, no logos,
  no watermark

# the base scene is the words the RENDERER actually receives — richness
# demanded only in `structure` never reaches fal, which is how a bare
# two-tap kitchen got rendered from an unobjectionable-sounding brief
base_scene_rule: >
  the room written ONCE — camera position (set off the central axis, never
  a symmetric one-point view), what is in it and where things sit, the
  light, and the view out. Name at least eight concrete furnishings and
  styling layers (seating, tables where they belong, shelving and what is
  on it, lighting fixtures, art, textiles, plants) so the room arrives
  furnished, not bare. Every fixture exactly once — one sink with one tap,
  one cooker — and walkways left clear: nothing parked in an aisle or a
  doorway path. It must contain NO colours, finishes or materials that a
  frame is going to change, and it is repeated verbatim in every frame.

# the label is what gets printed on the boards, so it must be complete
label_rule: >
  `label` names the materials this scheme changes, three or four of them,
  EACH with its own hex colour code AND the surface it covers. THE WALLS
  COME FIRST, always: they are most of what the eye sees, and a board that
  leaves them out explains nothing — "forest green zellige walls #2D5F2E ·
  pale stone basin #C9C6BA · aged nickel taps #6B7280". Every material that
  can carry a colour carries one; a material with no colour to give (clear
  glass, mirror) may go without. Generic material names and hex codes only,
  never a real paint brand, product or SKU.

frames: [4, 6]          # schemes per reel
aspect: vertical        # 9:16 — fills a phone in Reels
label_style: board      # names on the texture boards, nothing on the room
board_secs: 1.1         # the board holds just long enough to read

# THE FIRST SECOND. June's reels reached 146 and 159 people and were liked
# by none of them (measured 2026-08-16) — distribution was never the
# problem, the opening was. A texture board is a good SECOND beat and a
# poor first one: it asks for patience before it has earned any. So the
# reel opens by flashing every finished room in about a second — the payoff
# first, the method after.
hook: flash
hook_secs: 0.28
secs_per_frame: 1.8     # the room holds longer than its board
cut: hard               # a cut, never a dissolve
voiceover: false

# A second draft from the same frames: the reel reaches people who do not
# follow the account, the carousel is what the ones who do read and SAVE.
# Zero extra render — the frames already exist.
carousel_twin: true        # the operator adds a trending track in the app

# The room is rendered ONCE and every other scheme is an edit of that
# render, so the geometry cannot drift between frames.
# Instruction editing, not strength-based image-to-image: at any strength
# that kept the room, the scheme did not apply, and at any strength that
# applied it, the room drifted. Told in words what to change, the editor
# does both. (Measured 2026-08-16 on a real powder-room render.)
image_mode: edit
